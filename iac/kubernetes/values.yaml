#valores padrões para o Helm Chart

#ServiceAccount
serviceAccount:
  name: secrets-sa

#Aplicação
app:
  name: oauth
  replicas: 1
  image:
    repository: ${AWS_ECR_REPOSITORY}
    tag: latest
    pullPolicy: IfNotPresent
  port: 8080
  containerName: oauth
  internalUrl: ${LNCR_INTERNAL_URL}
  externalUrl: ${LNCR_EXTERNAL_URL}

#Service
service:
  port: 80
  targetPort: 8080

#Ingress
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/load-balancer-name: ${ALB_NAME}
    alb.ingress.kubernetes.io/group.name: ${ALB_NAME}
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/subnets: ${ALB_SUBNETS}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/security-groups: ${ALB_SECURITY_GROUP}
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
  hosts:
  - host: ${INGRESS_HOST}
    paths:
    - path: /
      pathType: Prefix
  tls: []


#Deployment
resources:
  pods:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

#HPA
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

#SecretProviderClass
secretProviderClass:
  name: "lncr-ms-oauth-prd-secrets"
  namespace: prodution
  provider: aws
  parameters:
    region: "us-east-1"
    objects:
      - objectName: ${ AWS_SECRET_MANAGER_ARN }
        objectType: secretsmanager
  keys:
    - LNCR_OAUTH_SECRET_KEY
    - LNCR_OAUTH_ADMIN_CLIENT_ID
    - LNCR_OAUTH_ADMIN_CLIENT_SECRET
    - LNCR_OAUTH_MONITOR_CLIENT_ID
    - LNCR_OAUTH_MONITOR_CLIENT_SECRET
    - LNCR_OAUTH_TOTEM_CLIENT_ID
    - LNCR_OAUTH_TOTEM_CLIENT_SECRET
  secretObjects:
    - secretName: oauth-secret
      type: Opaque
  twoSecrets:
    enabled: false
deploySecretName: oauth-secret
